name: Test

# The one job with real per-repo variance: it needs a pgvector service
# container, the MEMSTORE_TEST_PG env, and a coverage upload, none of which a
# reusable workflow can express. The static-analysis quartet is delegated to
# infodancer/workflows in ci.yml.
#
# The hooks job covers the Node test files (the Claude Code hook shims and the
# Codex example). Those are not Go, so ci.yml's path filters skip them and the
# Go test job never touches them -- without this job their coverage would only
# ever run on a developer's machine.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Twice: once with the store fixtures on SQLite (the default), once on
      # PostgreSQL. The daemon only runs on PostgreSQL, so the second run is
      # the one that says whether its HTTP and MCP layers work; the first is
      # kept while the SQLite backend is still shipped.
      - name: Run tests with coverage (sqlite fixtures)
        env:
          MEMSTORE_TEST_PG: postgres://test:test@localhost:5432/test?sslmode=disable
        run: go test -race -count=1 -coverprofile=coverage-sqlite.out ./...

      - name: Run tests with coverage (postgres fixtures)
        env:
          MEMSTORE_TEST_PG: postgres://test:test@localhost:5432/test?sslmode=disable
          MEMSTORE_TEST_BACKEND: pg
        run: go test -race -count=1 -coverprofile=coverage-pg.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage-sqlite.out,coverage-pg.out

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Bare `node --test` discovers **/*.test.mjs from the repo root, so a new
      # hook test is picked up without editing this workflow.
      - name: Run Node tests
        run: node --test
