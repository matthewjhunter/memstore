version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  test:
    desc: Run tests with race detector
    cmds:
      - go test -race -count=1 ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Check formatting
    cmds:
      - test -z "$(gofmt -l .)"

  fmt:fix:
    desc: Fix formatting
    cmds:
      - gofmt -w .

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  vulncheck:
    desc: Run govulncheck
    cmds:
      - govulncheck ./...

  check:
    desc: Run all CI checks (test, vet, fmt, lint, vulncheck)
    cmds:
      - task: test
      - task: vet
      - task: fmt
      - task: lint
      - task: vulncheck

  build:
    desc: Build all binaries
    cmds:
      - GOWORK=off go build ./cmd/memstore-mcp
      - GOWORK=off go build ./cmd/memstore

  clean:
    desc: Remove built binaries
    cmds:
      - rm -f memstore-mcp memstore

  install:
    desc: Install binaries to GOPATH/bin
    cmds:
      - GOWORK=off go install ./cmd/memstore-mcp
      - GOWORK=off go install ./cmd/memstore

  hooks:install:
    desc: Install git hooks (pre-commit and pre-push)
    cmds:
      - cp githooks/pre-commit .git/hooks/pre-commit
      - chmod +x .git/hooks/pre-commit
      - cp githooks/pre-push .git/hooks/pre-push
      - chmod +x .git/hooks/pre-push
    status:
      - test -f .git/hooks/pre-commit
      - diff -q githooks/pre-commit .git/hooks/pre-commit
      - test -f .git/hooks/pre-push
      - diff -q githooks/pre-push .git/hooks/pre-push

  # --- Harness integration ------------------------------------------------
  # Each install:<harness> task wires memstore into one AI coding harness,
  # plus passive hooks where the harness has a surface for them. They are
  # idempotent and safe to re-run. Harnesses with shared config files (Zed,
  # Codex) print the snippet for manual paste rather than mutating user
  # config; the rest write config directly.
  #
  # Claude Code, Cursor, and Zed register the daemon's HTTP endpoint: there
  # is no local MCP process, and the token decides what the session may do.
  # Codex is the exception and is still on the stdio binary -- see the
  # staleness notice in examples/codex/README.md.
  #
  # MEMSTORE_REMOTE overrides the daemon base URL (prefix included).
  # MEMSTORE_API_KEY, if set, is written into the harness config as a bearer
  # header. Neither Cursor nor Zed is documented to expand ${VAR} inside a
  # headers value, so the token goes in literally -- which is why the tasks
  # below tighten the file mode and say so.

  install:claude:
    desc: Install memstore Claude Code hooks + MCP entry (via ./memstore setup)
    deps: [install]
    cmds:
      - memstore setup
    preconditions:
      - sh: command -v claude
        msg: "Claude Code CLI not found on PATH — install claude first"

  install:cursor:
    desc: Register the memstore HTTP endpoint in ~/.cursor/mcp.json (idempotent jq merge)
    vars:
      MEMSTORE_URL:
        sh: echo "${MEMSTORE_REMOTE:-http://localhost:8230/memstore}/mcp"
    cmds:
      - mkdir -p "$HOME/.cursor"
      - test -s "$HOME/.cursor/mcp.json" || echo '{"mcpServers":{}}' > "$HOME/.cursor/mcp.json"
      - |
        if [ -n "${MEMSTORE_API_KEY:-}" ]; then
          jq --arg url "{{.MEMSTORE_URL}}" --arg auth "Bearer $MEMSTORE_API_KEY" \
             '.mcpServers.memstore = {"url":$url,"headers":{"Authorization":$auth}}' \
             "$HOME/.cursor/mcp.json" > "$HOME/.cursor/mcp.json.tmp"
        else
          # No key in the environment: keep whatever headers are already
          # there. Re-running the installer must not silently strip a token
          # that a previous run wrote and that Cursor is using.
          jq --arg url "{{.MEMSTORE_URL}}" \
             '.mcpServers.memstore = ({"url":$url} + (if (.mcpServers.memstore.headers|type) == "object" then {"headers": .mcpServers.memstore.headers} else {} end))' \
             "$HOME/.cursor/mcp.json" > "$HOME/.cursor/mcp.json.tmp"
        fi
      - mv "$HOME/.cursor/mcp.json.tmp" "$HOME/.cursor/mcp.json"
      - |
        if [ -n "${MEMSTORE_API_KEY:-}" ]; then
          chmod 600 "$HOME/.cursor/mcp.json"
          echo "Wrote a bearer token into ~/.cursor/mcp.json; mode tightened to 600."
        elif ! grep -q Authorization "$HOME/.cursor/mcp.json"; then
          echo "No MEMSTORE_API_KEY set — registered without a token. If the daemon"
          echo "requires auth, set MEMSTORE_API_KEY and re-run."
        fi
      - 'echo "Registered memstore at {{.MEMSTORE_URL}} in ~/.cursor/mcp.json"'
    preconditions:
      - sh: command -v jq
        msg: "jq is required for safe JSON merging — install jq"

  install:zed:
    desc: Print Zed context_servers snippet (settings.json is JSONC, no safe auto-merge)
    vars:
      MEMSTORE_URL:
        sh: echo "${MEMSTORE_REMOTE:-http://localhost:8230/memstore}/mcp"
      AUTH_LINE:
        sh: |
          if [ -n "${MEMSTORE_API_KEY:-}" ]; then
            printf '      "headers": { "Authorization": "Bearer %s" }' "$MEMSTORE_API_KEY"
          else
            printf '      "headers": { "Authorization": "Bearer YOUR_TOKEN" }'
          fi
    cmds:
      - |
        cat <<EOF

        Zed's settings.json is JSONC with extensive user content; auto-merge
        is unsafe. Paste this into the top-level object of
        ~/.config/zed/settings.json (merge with any existing context_servers
        block):

          "context_servers": {
            "memstore": {
              "url": "{{.MEMSTORE_URL}}",
        {{.AUTH_LINE}}
            }
          }

        Then restart Zed (or save settings.json — Zed hot-reloads).
        Zed has no per-prompt hook surface; this enables tools only.

        Leave the Authorization header in place even if the daemon runs
        without auth: with no header configured, Zed starts the MCP OAuth
        flow, which memstore does not implement (scope decision 4, deferred).

        EOF

  install:codex:
    desc: Install experimental Codex notify shim + print config.toml snippet
    vars:
      MEMSTORE_MCP_BIN:
        sh: echo "${MEMSTORE_MCP_BIN:-$(command -v memstore-mcp || echo $HOME/go/bin/memstore-mcp)}"
      SHIM_DEST: '{{.HOME}}/.codex/hooks/codex-notify-memstore.mjs'
    cmds:
      - install -Dm755 examples/codex/codex-notify-memstore.mjs "$HOME/.codex/hooks/codex-notify-memstore.mjs"
      - |
        cat <<EOF

        Experimental notify shim installed to:
          ~/.codex/hooks/codex-notify-memstore.mjs

        Add to ~/.codex/config.toml (creates if absent):

          notify = ["node", "$HOME/.codex/hooks/codex-notify-memstore.mjs"]

          [mcp_servers.memstore]
          command = "{{.MEMSTORE_MCP_BIN}}"
          args = []
          env = {}

        STALE: this config predates the HTTP transport. The block above
        registers a local stdio binary that is scheduled for removal, and
        the shim pipes to `memstore-mcp --hook` rather than `memstore hook`.
        See the staleness notice at the top of examples/codex/README.md
        before relying on it.

        See examples/codex/README.md for caveats (per-turn re-upload,
        silent nudges, recursion safety).

        EOF

  install:harnesses:
    desc: Run all harness installers (Claude, Cursor, Zed, Codex)
    cmds:
      - task: install:claude
      - task: install:cursor
      - task: install:zed
      - task: install:codex
